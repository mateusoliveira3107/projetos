<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafeteria Mateus</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 id="titulo">Cafeteria Mateus</h1>
        <p id="bemVindo">bem-vindo</p>
        <p id="subtitulo">Seu café favorito está aqui!</p>
        
        <button id="botaoMudarCor">Mudar Cor</button>
    </header>

    <main>
        <section>
            <h2>Nossos Produtos</h2>
            <hr class="linhaSeparacao">
            <ul>
                <li>
                    <span>Café Expresso - R$ 5,00</span>
                    <input type="number" name="cafeExpresso" id="addrmvCafeExpresso" class="addRmv" min="0">
                    <button class="botaoAdicionar" data-produto="Café Expresso">Adicionar</button>
                    <button class="botaoRemover" data-produto="Café Expresso">Remover</button>
                </li>
                <li>
                    <span>Capuccino - R$ 8,00</span>
                    <input type="number" name="capuccino" id="addrmvCapuccino" class="addRmv" min="0">
                    <button class="botaoAdicionar" data-produto="Capuccino">Adicionar</button>
                    <button class="botaoRemover" data-produto="Capuccino">Remover</button>
                </li>
                <li>
                    <span>Bolo - R$ 12,00</span>
                    <input type="number" name="bolo" id="addrmvBolo" class="addRmv" min="0">
                    <button class="botaoAdicionar" data-produto="Bolo">Adicionar</button>
                    <button class="botaoRemover" data-produto="Bolo">Remover</button>
                </li>
                <li>
                    <span>Salgado - R$ 9,00</span>
                    <input type="number" name="salgado" id="addrmvSalgado" class="addRmv" min="0">
                    <button class="botaoAdicionar" data-produto="Salgado">Adicionar</button>
                    <button class="botaoRemover" data-produto="Salgado">Remover</button>
                </li> 
            </ul>
            <button class="botaoLimpar" Id="limparCarrinho">Limpar Carrinho</button>

        </section>

        <section class="secaoCarrinho">
            <h2>Seu Carrinho</h2>
            <p id="carrinho">Nenhum Produto Adicionado</p>
            <p id="total">Total: R$0.00</p>

            <label for="formaPagamento">Forma de Pagamento</label>
            
            <select id="formaPagamento">
                <option value="">Selecione</option>
                <option value="Dinheiro">Dinheiro</option>
                <option value="Cartão">Cartão</option>
                <option value="Pix">Pix</option>
            </select>

            <div id="resumo"></div>

            <br>
            <button id="botaoFinalizar">Finalizar Pedido</button>
        </section>
    </main>


    <script src="script.js"></script>
</body>
</html>
